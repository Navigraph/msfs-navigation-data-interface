[package]
name = "msfs-navigation-data-interface"
version = "1.2.3"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["msfs"]
# The MSFS gauge: CommBus, work folder navigation data and network downloads
msfs = ["dep:msfs", "dep:dotenv_codegen", "dep:uuid", "dep:zip"]
# Runs outside the sim, serving mock navigation data. Build with `bun run build:wasm:standalone`, which generates the mock data in
# the build container and runs `cargo build --no-default-features --features standalone`
standalone = ["rusqlite/serialize"]

[dependencies]
anyhow = "1.0.97"
dotenv_codegen = { version = "0.15.0", optional = true }
futures-lite = "2.6.0"
msfs = { git = "https://github.com/flybywiresim/msfs-rs.git", rev = "599c75c", optional = true }
once_cell = "1.21.2"
paste = "1.0.15"
regex = "1.11.1"
rusqlite = { version = "0.32.0", features = ["bundled"] }
sentry = { version = "0.37.0", default-features = false, features = [
    "anyhow",
    "panic",
    "backtrace",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_rusqlite = "0.36.0"
serde_with = "3.12.0"
uuid = { version = "1.16.0", features = ["rng-rand", "v4"], optional = true }
zip = { version = "2.5.0", default-features = false, features = [
    "deflate",
], optional = true }

[build-dependencies]
vergen-gitcl = { version = "1.0.8", features = ["build", "cargo"] }
